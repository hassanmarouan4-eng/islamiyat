# بناء تطبيق أندرويد «منصة دروسي» (مجلد android) ونشر ملف APK في صفحة Releases.
# يعمل عند كل تعديل في مجلد android، وعند دفع وسم إصدار مثل v1.0.0.
name: Build Android app

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Use the private upload key when it is configured (Google Play)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --stacktrace assembleRelease

      - name: Build Play Store bundle
        if: env.SIGNING_STORE_FILE != ''
        run: ./gradlew --stacktrace bundleRelease

      - name: Collect files
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/dorossi-$VERSION.apk"
          # Fixed name, so the platform can link to .../releases/latest/download/dorossi.apk
          cp app/build/outputs/apk/release/*.apk dist/dorossi.apk
          if ls app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then
            cp app/build/outputs/bundle/release/*.aab "dist/dorossi-$VERSION.aab"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: dorossi-apk
          path: android/dist/

      # A release made on GitHub (Releases > Draft a new release > tag v1.0.0 > Publish) or a pushed
      # v* tag gets the APK attached; dorossi.apk keeps the same name in every version.
      - name: Attach the APK to the GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "منصة دروسي $GITHUB_REF_NAME" \
              --notes "تطبيق منصة دروسي لأندرويد: نزّل ملف dorossi.apk وافتحه على الهاتف، ثم اسمح بالتثبيت من هذا المصدر."
          fi
